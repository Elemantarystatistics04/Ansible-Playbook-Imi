---
- name: Deploy custom .gitconfig
  ansible.builtin.copy:
    src: gitconfig
    dest: /home/imi/.gitconfig
    owner: imi
    group: imi
    mode: '0644'

- name: Manage custom aliases in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED ALIASES"
    block: |
      alias ll='ls -alF'
      {% raw %}alias dps='docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"'{% endraw %}
      alias dcu='docker compose up -d'
      alias dcd='docker compose down'
