services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "9119:9119"
    environment:
      - HERMES_HOME=/opt/data/.hermes
      - HERMES_WRITE_SAFE_ROOT=/opt/data
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - XDG_RUNTIME_DIR=/tmp/hermes-runtime
      - HERMES_DASHBOARD=true
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-imi}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
    volumes:
      - hermes_data:/opt/data

volumes:
  hermes_data:
